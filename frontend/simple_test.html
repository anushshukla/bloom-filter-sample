<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fetch Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .loading { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Simple Fetch Test</h1>
    
    <div>
        <button onclick="testSimpleFetch()">Test Simple Fetch</button>
        <button onclick="testBloomFilterAPI()">Test Bloom Filter API</button>
        <button onclick="testWithTimeout()">Test With Timeout</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        function addResult(message, type = 'loading') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            resultsDiv.appendChild(resultDiv);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testSimpleFetch() {
            clearResults();
            addResult('🔄 Testing simple fetch to backend...', 'loading');
            
            try {
                const startTime = Date.now();
                const response = await fetch('http://localhost:8080/api/bloom-filter/list');
                const endTime = Date.now();
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`
                        ✅ <strong>Simple Fetch Success</strong> (${endTime - startTime}ms)
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `, 'success');
                } else {
                    addResult(`
                        ❌ <strong>Simple Fetch Failed</strong> - HTTP ${response.status}
                    `, 'error');
                }
            } catch (error) {
                addResult(`
                    ❌ <strong>Simple Fetch Error</strong>
                    <pre>${error.message}</pre>
                `, 'error');
            }
        }
        
        async function testBloomFilterAPI() {
            clearResults();
            addResult('🔄 Testing bloom filter creation...', 'loading');
            
            try {
                const payload = {
                    filter_name: 'simple_test',
                    file_content: 'test\nsimple\nfetch',
                    expected_elements: 100,
                    false_positive_rate: 0.01
                };
                
                const startTime = Date.now();
                const response = await fetch('http://localhost:8080/api/bloom-filter/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const endTime = Date.now();
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`
                        ✅ <strong>Bloom Filter Creation Success</strong> (${endTime - startTime}ms)
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `, 'success');
                } else {
                    const errorText = await response.text();
                    addResult(`
                        ❌ <strong>Bloom Filter Creation Failed</strong> - HTTP ${response.status}
                        <pre>${errorText}</pre>
                    `, 'error');
                }
            } catch (error) {
                addResult(`
                    ❌ <strong>Bloom Filter Creation Error</strong>
                    <pre>${error.message}</pre>
                `, 'error');
            }
        }
        
        async function testWithTimeout() {
            clearResults();
            addResult('🔄 Testing with timeout handling...', 'loading');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    console.log('⏰ Timeout triggered');
                    controller.abort();
                }, 30000);
                
                addResult('⏱️ Starting request with 30s timeout...', 'loading');
                
                const startTime = Date.now();
                const response = await fetch('http://localhost:8080/api/bloom-filter/list', {
                    signal: controller.signal
                });
                const endTime = Date.now();
                
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`
                        ✅ <strong>Timeout Test Success</strong> (${endTime - startTime}ms)
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `, 'success');
                } else {
                    addResult(`
                        ❌ <strong>Timeout Test Failed</strong> - HTTP ${response.status}
                    `, 'error');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    addResult(`
                        ⏰ <strong>Request Aborted by Timeout</strong>
                        <pre>${error.message}</pre>
                    `, 'error');
                } else {
                    addResult(`
                        ❌ <strong>Timeout Test Error</strong>
                        <pre>${error.message}</pre>
                    `, 'error');
                    console.error('Full error:', error);
                }
            }
        }
        
        // Auto-test on page load
        window.addEventListener('load', () => {
            addResult('🌐 Page loaded. Click buttons above to test different scenarios.', 'loading');
        });
    </script>
</body>
</html>
